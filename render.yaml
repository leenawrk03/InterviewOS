databases:
  - name: interview-os-db
    databaseName: interviewos
    user: interviewos
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: interview-os
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/interviews/prep/ping
    envVars:
      # --- Postgres (wired automatically from the database above) ---
      - key: DATABASE_URL
        fromDatabase:
          name: interview-os-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: interview-os-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: interview-os-db
          property: password

      # --- Session cookie: HTTPS-only, same-origin ---
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: Lax

      # --- Secrets: set these in the Render dashboard, not in git ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

      # --- Optional toggles ---
      - key: MAIL_ENABLED
        value: "false"
      - key: AI_ENABLED
        value: "true"
