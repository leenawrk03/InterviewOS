server:
  # Render injects PORT into the container.
  port: ${PORT:8080}
  # Render terminates TLS at its proxy; without this Spring builds the OAuth
  # redirect_uri as http:// and Google rejects it.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: ${COOKIE_SAME_SITE:Lax}

spring:
  application:
    name: interview-os-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/interviewos}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:0000}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
              - https://www.googleapis.com/auth/calendar.readonly
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  frontend:
    # Angular dev server. Used for CORS and for the post-login redirect.
    base-url: ${FRONTEND_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:4200}}
    default-redirect-path: /dashboard
  mail:
    from: ${MAIL_FROM:}
    enabled: ${MAIL_ENABLED:true}
  ai:
    provider: gemini            # gemini | huggingface | openrouter (later)
    enabled: ${AI_ENABLED:true}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash}
      base-url: https://generativelanguage.googleapis.com/v1beta
      timeout-seconds: 60

logging:
  level:
    org.springframework.security: INFO


